AWSTemplateFormatVersion: '2010-09-09'
Description: SentinelAI - Event-Driven AIOps Infrastructure (SQS + DLQ, S3, SNS, ECS Cluster)

Parameters:
  EnvironmentName:
    Type: String
    Default: production
    AllowedValues: [staging, production]

Resources:
  IncidentDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub sentinel-incident-dlq-${EnvironmentName}
      MessageRetentionPeriod: 1209600

  IncidentEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub sentinel-incident-events-${EnvironmentName}
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IncidentDeadLetterQueue.Arn
        maxReceiveCount: 3

  IncidentSnapshotsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub sentinel-incident-snapshots-${AWS::AccountId}-${EnvironmentName}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CriticalIncidentsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub sentinel-critical-incidents-${EnvironmentName}

  SentinelEcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub sentinel-cluster-${EnvironmentName}

Outputs:
  IncidentQueueUrl:
    Value: !Ref IncidentEventsQueue
  SnapshotsBucketName:
    Value: !Ref IncidentSnapshotsBucket
  CriticalTopicArn:
    Value: !Ref CriticalIncidentsTopic
